
<div class="pagina">

  <div class="cabecalho">
    <div>
      <h1>👤 Cadastro de Tutores</h1>

      <button mat-raised-button color="primary" [routerLink]="['/']">
        ← Voltar ao início
      </button>

      <p>Gerencie os responsáveis pelos pets.</p>
    </div>
  </div>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ editando ? 'Editar Tutor' : 'Novo Tutor' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="editando ? atualizar() : cadastrar()">

        <mat-form-field appearance="outline">
          <mat-label>Nome completo</mat-label>
          <input matInput name="nome" [(ngModel)]="tutor.nome" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Telefone</mat-label>
          <input matInput name="telefone" [(ngModel)]="tutor.telefone" required>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit">
          {{ editando ? 'Salvar alterações' : 'Cadastrar tutor' }}
        </button>

        <button *ngIf="editando" mat-button type="button" (click)="limparFormulario()">
          Cancelar
        </button>

      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="lista">
    <mat-card-header>
      <mat-card-title>Tutores cadastrados</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="tutores">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let tutor">{{ tutor.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let tutor">{{ tutor.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="telefone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let tutor">{{ tutor.telefone }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let tutor">

            <button mat-raised-button color="primary" (click)="editar(tutor)">
              Editar
            </button>

            <button mat-raised-button color="warn" (click)="excluir(tutor.id)">
              Excluir
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id', 'nome', 'telefone', 'acoes']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id', 'nome', 'telefone', 'acoes']"></tr>

      </table>
    </mat-card-content>
  </mat-card>

</div>
